<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flip The Script – Coming Soon</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="poster.png"/>
  <link rel="apple-touch-icon" href="poster.png"/>

  <!-- Primary Meta -->
  <meta name="title" content="Flip The Script – Coming Soon"/>
  <meta name="description" content="Every story has two sides. What happens when someone decides to rewrite theirs — no matter the cost? Coming Soon."/>

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Flip The Script – Coming Soon"/>
  <meta property="og:description" content="Every story has two sides. What happens when someone decides to rewrite theirs — no matter the cost? Coming Soon."/>
  <meta property="og:image" content="poster.png"/>
  <meta property="og:image:width" content="1400"/>
  <meta property="og:image:height" content="788"/>

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Flip The Script – Coming Soon"/>
  <meta name="twitter:description" content="Every story has two sides. What happens when someone decides to rewrite theirs — no matter the cost? Coming Soon."/>
  <meta name="twitter:image" content="poster.png"/>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red-vivid:  #d40000;
      --red-bright: #ff1a1a;
      --white:      #ffffff;
      --muted:      rgba(255,255,255,0.55);
    }

    html, body {
      height: 100%;
      background: #0a0000;
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      overflow-x: hidden;
    }

    /* ────────────────────────────────────────
       HERO
       Full-bleed image behind everything.
       Grid: [text col] [spacer col] on desktop
             single col on mobile (text bottom)
    ──────────────────────────────────────── */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: 1fr;
      overflow: hidden;
    }

    /* Full-bleed image layer */
    .hero-portrait {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero-portrait-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 68% center;
      display: block;
      filter: contrast(1.05) saturate(0.9);
      animation: imgReveal 1.5s cubic-bezier(0.22,1,0.36,1) both 0.2s;
    }

    @keyframes imgReveal {
      from { opacity: 0; transform: scale(1.04); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Gradient overlay – dark left for text, clear right for face */
    .hero-portrait::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right,
          rgba(4,0,0,0.92) 0%,
          rgba(4,0,0,0.65) 32%,
          rgba(4,0,0,0.18) 58%,
          transparent 100%),
        linear-gradient(to top,
          rgba(4,0,0,0.55) 0%,
          transparent 35%);
    }

    /* Subtle grain */
    .hero-portrait::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      background-size: 200px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* Text content – left grid cell */
    .hero-content {
      position: relative;
      z-index: 10;
      grid-column: 1;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(5rem, 9vw, 8rem) clamp(2rem, 5vw, 5rem) clamp(3rem, 5vw, 5rem);
      animation: contentSlide 1.1s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes contentSlide {
      from { opacity: 0; transform: translateX(-36px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* LABEL */
    .label {
      font-size: clamp(0.62rem, 1.4vw, 0.75rem);
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--red-bright);
      margin-bottom: clamp(0.8rem, 2vw, 1.6rem);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.65s;
    }

    /* TITLE */
    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4.5rem, 10vw, 10rem);
      line-height: 0.91;
      text-transform: uppercase;
      color: var(--white);
      letter-spacing: 0.03em;
      text-shadow: 0 2px 40px rgba(0,0,0,0.7), 0 0 80px rgba(180,0,0,0.35);
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.8s;
    }

    .title span { display: block; }

    /* DIVIDER */
    .divider {
      width: 48px;
      height: 3px;
      background: var(--red-vivid);
      margin: clamp(0.9rem, 2.5vw, 1.8rem) 0;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.95s;
    }

    /* TAGLINE */
    .tagline {
      font-size: clamp(0.8rem, 1.6vw, 0.98rem);
      font-weight: 300;
      color: var(--muted);
      line-height: 1.75;
      max-width: 320px;
      margin-bottom: clamp(1.4rem, 3vw, 2.6rem);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.05s;
    }

    /* SUBSCRIBE WRAPPER */
    .subscribe-wrapper {
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.15s;
    }

    .subscribe-label {
      font-size: clamp(0.6rem, 1.2vw, 0.7rem);
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    /* SUBSCRIBE FORM – input + button side by side */
    .subscribe-form {
      display: grid;
      grid-template-columns: 1fr auto;
      width: 100%;
      max-width: 400px;
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 4px;
      overflow: hidden;
      transition: border-color 0.3s;
      backdrop-filter: blur(6px);
    }

    .subscribe-form:focus-within {
      border-color: var(--red-vivid);
    }

    .subscribe-input {
      background: rgba(0,0,0,0.5);
      border: none;
      outline: none;
      padding: 0.85rem 1rem;
      font-family: 'Barlow', sans-serif;
      font-size: clamp(0.78rem, 1.6vw, 0.88rem);
      color: var(--white);
      min-width: 0;
      width: 100%;
    }

    .subscribe-input::placeholder {
      color: rgba(255,255,255,0.28);
    }

    .subscribe-btn {
      background: var(--red-vivid);
      border: none;
      cursor: pointer;
      padding: 0.85rem clamp(1rem, 2vw, 1.5rem);
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(0.9rem, 1.8vw, 1.05rem);
      letter-spacing: 0.14em;
      color: var(--white);
      white-space: nowrap;
      transition: background 0.22s, transform 0.12s;
    }

    .subscribe-btn:hover  { background: var(--red-bright); }
    .subscribe-btn:active { transform: scale(0.97); }

    .privacy-note {
      font-size: 0.63rem;
      color: rgba(255,255,255,0.22);
      margin-top: 0.65rem;
      letter-spacing: 0.05em;
    }

    /* SUCCESS STATE */
    .success-msg {
      display: none;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 0;
      font-size: 0.9rem;
    }

    .success-msg .check {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--red-vivid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes popIn  { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    /* ──────────────────────────────────────
       TABLET LANDSCAPE  ≤ 1024px
    ────────────────────────────────────── */
    @media (max-width: 1024px) {
      .hero { grid-template-columns: 1fr 0.8fr; }
      .title { font-size: clamp(4.5rem, 11vw, 9rem); }
    }

    /* ──────────────────────────────────────
       TABLET PORTRAIT  ≤ 768px
       Single column – image full bleed,
       text anchored to bottom
    ────────────────────────────────────── */
    @media (max-width: 768px) {
      .hero {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
        min-height: 100svh;
      }

      .hero-portrait-img {
        object-position: 58% center;
      }

      /* Stronger bottom gradient so text is readable */
      .hero-portrait::after {
        background:
          linear-gradient(to bottom,
            rgba(4,0,0,0.3)  0%,
            rgba(4,0,0,0.15) 30%,
            rgba(4,0,0,0.7)  65%,
            rgba(4,0,0,0.95) 100%),
          linear-gradient(to right,
            rgba(4,0,0,0.4) 0%,
            transparent 55%);
      }

      .hero-content {
        grid-column: 1;
        grid-row: 1;
        justify-content: flex-end;
        padding: 2rem clamp(1.4rem, 5vw, 2.5rem) clamp(2.5rem, 7vw, 4rem);
      }

      .title   { font-size: clamp(4rem, 13vw, 7rem); }
      .tagline { max-width: 100%; }
      .subscribe-form { max-width: 100%; }
    }

    /* ──────────────────────────────────────
       MOBILE  ≤ 480px
       Show more of the person's face,
       stacked subscribe form
    ────────────────────────────────────── */
    @media (max-width: 480px) {
      .hero-portrait-img {
        object-position: 62% 5%;
      }

      /* Almost no overlay on top half so face is fully visible */
      .hero-portrait::after {
        background:
          linear-gradient(to bottom,
            rgba(4,0,0,0.0)  0%,
            rgba(4,0,0,0.0)  50%,
            rgba(4,0,0,0.78) 72%,
            rgba(4,0,0,0.97) 100%);
      }

      .hero-content {
        justify-content: flex-end;
        padding: 1.5rem 1.4rem clamp(1.8rem, 7vw, 2.8rem);
      }

      .title { font-size: clamp(5rem, 24vw, 8rem); line-height: 0.88; }

      .tagline {
        font-size: 0.85rem;
        max-width: 100%;
        margin-bottom: 1.4rem;
      }

      /* Stacked full-width form */
      .subscribe-form {
        grid-template-columns: 1fr;
        max-width: 100%;
        border: none;
        border-radius: 0;
        gap: 0.55rem;
        backdrop-filter: none;
        overflow: visible;
      }

      .subscribe-input {
        border: 1.5px solid rgba(255,255,255,0.2);
        border-radius: 4px;
      }

      .subscribe-btn {
        border-radius: 4px;
        width: 100%;
        padding: 1rem;
        font-size: 1.1rem;
        text-align: center;
      }
    }

    /* ──────────────────────────────────────
       VERY SMALL  ≤ 360px
    ────────────────────────────────────── */
    @media (max-width: 360px) {
      .title { font-size: clamp(4.2rem, 22vw, 5.5rem); line-height: 0.88; }
      .label { font-size: 0.6rem; }
    }
  </style>
</head>
<body>

<section class="hero">

  <!-- Full-bleed background image -->
  <div class="hero-portrait">
    <img class="hero-portrait-img" src="poster.png" alt="Flip The Script"/>
  </div>

  <!-- Text content overlaid on left -->
  <div class="hero-content">

    <p class="label">Coming Soon</p>

    <h1 class="title">
      <span>Flip</span>
      <span>The</span>
      <span>Script</span>
    </h1>

    <div class="divider"></div>

    <p class="tagline">
      Every story has two sides. What happens when someone decides to rewrite theirs — no matter the cost?
    </p>

    <!-- Subscribe -->
    <div class="subscribe-wrapper">
      <p class="subscribe-label">Get Notified on Release Day</p>

      <div class="subscribe-form" id="subForm">
        <input
          class="subscribe-input"
          type="email"
          id="emailInput"
          placeholder="your@email.com"
          autocomplete="email"
        />
        <button class="subscribe-btn" onclick="handleSubscribe()">Notify Me</button>
      </div>

      <div class="success-msg" id="successMsg">
        <div class="check">✓</div>
        <div>
          <strong>You're on the list.</strong><br>
          <span style="color:var(--muted); font-size:0.78rem;">We'll alert you the moment it drops.</span>
        </div>
      </div>

      <p class="privacy-note" id="privacyNote">No spam. Unsubscribe anytime.</p>
    </div>

  </div>
</section>

<script>
  const NOTIFY_EMAIL = 'achdouzcompanyllc@gmail.com';

  function handleSubscribe() {
    const input = document.getElementById('emailInput');
    const email = input.value.trim();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      input.style.outline = '2px solid var(--red-bright)';
      input.focus();
      setTimeout(() => input.style.outline = '', 1200);
      return;
    }

    const subject = encodeURIComponent('Flip The Script \u2013 New Subscriber');
    const body    = encodeURIComponent(
      'New subscriber:\n\nEmail: ' + email +
      '\n\nThey want to be notified when Flip The Script is released.'
    );
    window.open('mailto:' + NOTIFY_EMAIL + '?subject=' + subject + '&body=' + body);

    document.getElementById('subForm').style.display     = 'none';
    document.getElementById('privacyNote').style.display = 'none';
    document.getElementById('successMsg').style.display  = 'flex';
  }

  document.getElementById('emailInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleSubscribe();
  });
</script>
</body>
</html>
